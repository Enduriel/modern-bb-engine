[package]
name = "bb-app"
version = "0.1.0"
edition = "2024"

# The game in a window: the engine, the renderer and the player's input.
[[bin]]
name = "bb"
path = "src/main.rs"

[features]
# The game's real UI: its page in the browser host (bb-ui with CEF), drawn over the
# frame and taking the player's input. Off by default, like bb-ui's `cef`: it downloads
# and links a CEF distribution, which the workspace's tests don't need.
ui = ["dep:bb-ui", "bb-ui/cef", "dep:cef-dll-sys"]

[dependencies]
bb-assets = { path = "../bb-assets" }
bb-audio = { path = "../bb-audio" }
bb-engine = { path = "../bb-engine" }
bb-ui = { path = "../bb-ui", optional = true }
# Direct dependency only for its build metadata (the CEF directory, for the rpath).
cef-dll-sys = { version = "=154.5.0", optional = true }
bb-render = { path = "../bb-render" }
bb-steam = { path = "../bb-steam" }
# The engine's libraries' warnings in log.html (`log_records`): wgpu's backends report
# the system's errors only through it. Already in the tree through wgpu, at this version.
log = "0.4.31"
squirrel = { path = "../squirrel" }
squirrel-bb = { path = "../squirrel-bb" }
wgpu = "30.0.1"
winit = "0.30.13"

# macOS: the game's cursor pixel for pixel on scaled displays (`system_cursor`), and the
# wheel event being handled (`wheel`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSBitmapImageRep", "NSCursor", "NSEvent", "NSGraphics", "NSImage", "NSImageRep", "NSResponder", "NSView", "NSWindow"] }

# Linux and the BSDs: Wayland's clipboard through the game's own connection to the
# compositor (`clipboard::wayland`). 0.7.2 is on winit
# 0.30's smithay-client-toolkit (0.19), so it brings no other crate; 0.7.3 moved to 0.20.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
smithay-clipboard = "=0.7.2"

# Linux and FreeBSD: the game's icon on its window under Wayland (`icon::wayland`, the
# `xdg_toplevel_icon_v1` staging protocol, which winit 0.30 doesn't set), on winit's own
# connection, the icon's pixels shared through a memfd (the versions winit already
# brings).
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
libc = "0.2.186"
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }

# Windows: the player's Documents folder from the shell's known folders, for the
# original's savegames folder (`saves::documents`), and the process's console, job and
# crash filter (`win_process`); the version bb-render uses,
# with the features for the calls.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_System_Com",
	"Win32_System_Console",
	"Win32_System_Diagnostics_Debug",
	"Win32_System_JobObjects",
	"Win32_System_Kernel",
	"Win32_System_LibraryLoader",
	"Win32_System_Threading",
	"Win32_UI_Shell",
] }

[dev-dependencies]
# To read the logs' archives in tests (bb-engine's, with the same features).
zip = { version = "1.1.4", default-features = false, features = ["deflate"] }

# Own `main`: the browser host re-runs the test binary for its child processes, and
# starts only once per process.
[[example]]
name = "frame_scenes"
required-features = ["ui"]

[[example]]
name = "held_key"
required-features = ["ui"]

[[example]]
name = "load_times"
required-features = ["ui"]

[[example]]
name = "page_paint"
path = "examples/page_paint/main.rs"
required-features = ["ui"]

[[test]]
name = "ui_window"
harness = false
required-features = ["ui"]

[[test]]
name = "frame_regression"
harness = false
required-features = ["ui"]

[[test]]
name = "mods_start_input"
harness = false
required-features = ["ui"]
