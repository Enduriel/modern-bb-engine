# Release bundles: one per target, each built natively on its own runner by the same
# script as locally (scripts/bundle.py, see docs/packaging.md), and
# uploaded as an artifact. Builds and packages only: the test suite needs the game's
# Steam data, which isn't on GitHub's runners.
#
# Runs on demand (Actions > bundles > Run workflow) and on version tags. A version tag
# also gets a draft release with every target's archive (GitHub shows each asset's
# SHA-256 itself), published by hand once checked.
name: bundles

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # squirrel-sys (Enduriel/squirrel-sys) is a submodule at squirrel-sys/, and the VM
  # (Enduriel/squirrel) a submodule of it; both are checked out with this repository at
  # the commits it records.
  CARGO_TERM_COLOR: never

jobs:
  bundle:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      BUNDLE_CACHE: ${{ github.workspace }}/bundle-cache
      BUNDLE_OUT: ${{ github.workspace }}/bundles
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Python (the script needs 3.11+)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Linux build and run-time libraries
        if: runner.os == 'Linux'
        # cmake/ninja/clang build squirrel-sys (bindgen needs libclang); ALSA is bb's
        # sound; the rest is what libcef.so links, for the smoke check.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang libclang-dev pkg-config libasound2-dev \
            libglib2.0-0t64 libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 \
            libdbus-1-3 libcups2t64 libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 \
            libxrandr2 libgbm1 libexpat1 libxcb1 libxkbcommon0 libcairo2 libpango-1.0-0 libudev1

      - name: Cargo's downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ matrix.target }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-${{ runner.arch }}-

      # CEF's archive, Steam's pinned crate and ninja, all checked against their pins on
      # every run; keyed on the files that hold the pins.
      - name: Pinned downloads (CEF, Steam, ninja)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bundle-cache/cef/*/*.tar.bz2
            bundle-cache/steam/*.crate
            bundle-cache/downloads
          key: bundle-${{ matrix.target }}-${{ hashFiles('scripts/bundle.py', 'bb-steam/src/pinned.rs') }}

      - name: Bundle
        run: python scripts/bundle.py --target "${{ matrix.target }}" --cache "$BUNDLE_CACHE" --out "$BUNDLE_OUT"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bb-${{ matrix.target }}
          path: |
            bundles/bb-${{ matrix.target }}.tar.gz
            bundles/bb-${{ matrix.target }}.zip
            bundles/bb-${{ matrix.target }}.*.sha256
            bundles/bb-${{ matrix.target }}.inputs.txt
          if-no-files-found: error
          compression-level: 0

  # After every target's bundle: a draft release for the tag, with one archive per target
  # attached. Only on version tags, and only when every target built.
  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bb-*
          path: bundles
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: bundles
        run: |
          shopt -s nullglob
          archives=(bb-*.tar.gz bb-*.zip)
          [ ${#archives[@]} -gt 0 ] || { echo "no bundles downloaded"; exit 1; }
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "bb ${TAG#v}" \
            --notes "Auto generated release. Unpack the archive for your system and double-click \`bb\`; see the README inside." \
            "${archives[@]}"
