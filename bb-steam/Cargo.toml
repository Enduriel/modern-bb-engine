[package]
name = "bb-steam"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"

# Steam achievements and stats for the windowed game: a small binding to the Steamworks
# flat C API, loaded at run time from the library beside the executable (never linked,
# so bb builds and runs without it), and the pinned copy of that library the release
# packaging fetches (see `pinned`).

# dlopen/dlsym on Unix (for this binding only).
[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
# The pinned library's hash, in the tests.
bb-sha256 = { path = "../bb-sha256" }
# The local Steam install of the game, for the tests that read it (as bb-engine's
# `install` finds it; the version pinned there).
steamlocate = "=2.1.1"
