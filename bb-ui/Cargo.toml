[package]
name = "bb-ui"
version = "0.1.0"
edition = "2024"

[features]
# The Chromium (CEF) host. Off by default: it downloads and links a CEF binary
# distribution (hundreds of MB), which plain `cargo test --workspace` doesn't need.
cef = ["dep:cef", "dep:cef-dll-sys", "dep:objc2", "dep:objc2-app-kit"]

[dependencies]
squirrel = { path = "../squirrel" }
squirrel-bb = { path = "../squirrel-bb" }
bb-engine = { path = "../bb-engine" }
# PNG decoding, to turn pictures upside down (`upside_down`).
bb-assets = { path = "../bb-assets" }
cef = { version = "=154.5.0", default-features = false, optional = true }
# Direct dependency only for its build metadata (the CEF directory, for the rpath).
cef-dll-sys = { version = "=154.5.0", optional = true }

# macOS: the application object CEF needs (`CefAppProtocol`, host/mac.rs), for
# the game's cursor; cef uses the same objc2.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3", optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSEvent"], optional = true }

[dev-dependencies]
# The tests' and tools' copy of the page's frame, on the GPU (the game's is bb-app's).
bb-render = { path = "../bb-render" }

[[example]]
name = "boot_menu_ui"
required-features = ["cef"]

[[example]]
name = "ui_parity"
required-features = ["cef"]

# Own `main`: Chromium re-runs the test binary for its child processes, and CEF can
# start only once per process.
[[test]]
name = "menu_ui"
harness = false
required-features = ["cef"]

[[test]]
name = "campaign_ui"
harness = false
required-features = ["cef"]

[[test]]
name = "play_session_ui"
harness = false
required-features = ["cef"]

[[test]]
name = "mods_ui"
harness = false
required-features = ["cef"]

[[test]]
name = "mods_battle_ui"
harness = false
required-features = ["cef"]

[[test]]
name = "ui_parity"
harness = false
required-features = ["cef"]

[[test]]
name = "mod_fonts_ui"
harness = false
required-features = ["cef"]
