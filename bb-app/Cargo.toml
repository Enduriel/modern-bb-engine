[package]
name = "bb-app"
version = "0.1.0"
edition = "2024"

# The game in a window: the engine, the renderer and the player's input.
[[bin]]
name = "bb"
path = "src/main.rs"

[features]
# The game's real UI: its page in the browser host (bb-ui with CEF), drawn over the
# frame and taking the player's input. Off by default, like bb-ui's `cef`: it downloads
# and links a CEF distribution, which the workspace's tests don't need.
ui = ["dep:bb-ui", "bb-ui/cef", "dep:cef-dll-sys"]

[dependencies]
bb-assets = { path = "../bb-assets" }
bb-audio = { path = "../bb-audio" }
bb-engine = { path = "../bb-engine" }
bb-ui = { path = "../bb-ui", optional = true }
# Direct dependency only for its build metadata (the CEF directory, for the rpath).
cef-dll-sys = { version = "=154.5.0", optional = true }
bb-render = { path = "../bb-render" }
squirrel = { path = "../squirrel" }
squirrel-bb = { path = "../squirrel-bb" }
wgpu = "30.0.1"
winit = "0.30.13"

[dev-dependencies]

# Own `main`: the browser host re-runs the test binary for its child processes, and
# starts only once per process.
[[example]]
name = "frame_scenes"
required-features = ["ui"]

[[example]]
name = "load_times"
required-features = ["ui"]

[[test]]
name = "ui_window"
harness = false
required-features = ["ui"]

[[test]]
name = "frame_regression"
harness = false
required-features = ["ui"]
