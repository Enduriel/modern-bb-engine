[package]
name = "bb-assets"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[features]
default = ["images"]
# PNG decoding and the background texture loader. The headless game logic only needs
# the sprite registry, so it builds without them.
images = ["dep:png"]

[dependencies]
png = { version = "0.18.1", optional = true }

[dev-dependencies]
# The local Steam install of the game, for the tests that read it (as bb-engine's
# `install` finds it; the version pinned there).
steamlocate = "=2.1.1"
