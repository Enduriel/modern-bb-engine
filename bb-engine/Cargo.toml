[package]
name = "bb-engine"
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[features]
# The heap census's access tracking, for the script_memory example.
census = ["squirrel/census"]

[dependencies]
squirrel = { path = "../squirrel" }
squirrel-bb = { path = "../squirrel-bb" }
bb-assets = { path = "../bb-assets" }
# STORED (base .dat) + DEFLATE (mod .zip) only — the heavier codecs (bzip2/zstd/aes)
# are off to keep the dependency set minimal.
zip = { version = "1.1.4", default-features = false, features = ["deflate"] }
# Local time for the archived logs' zip entries, and their names' UTC stamps (already
# squirrel-bb's, with the same features).
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
# Finding the game's Steam install: Steam's folder, its libraries and the game's in them
# (`install::steam`). Pinned: what it reads is Steam's
# own files, whose handling we check against this version.
steamlocate = "=2.1.1"
# SHA-256 (std only), for the reference mod corpus's pins (`mod_corpus`).
bb-sha256 = { path = "../bb-sha256" }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "archives"
harness = false

[[bench]]
name = "script_cache"
harness = false

[[example]]
name = "script_memory"
required-features = ["census"]
