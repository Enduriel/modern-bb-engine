[workspace]
resolver = "3"
members = ["squirrel", "squirrel-bb", "bb-engine", "bb-assets", "bb-ui", "bb-render", "bb-audio", "bb-app", "bb-steam", "bb-package", "bb-sha256"]
# squirrel-sys is its own repository, a submodule in this folder: a path dependency of
# squirrel, not a member. vendor/ holds patched third-party crates.
exclude = ["squirrel-sys", "vendor/download-cef"]

# cef-dll-sys's build fetches CEF with download-cef, whose ureq trusts a bundled CA list
# (webpki-roots). This copy trusts the system's own roots instead: vendor/download-cef/README.md.
[patch.crates-io]
download-cef = { path = "vendor/download-cef" }

# The Squirrel VM (C, built by cmake) runs every script; unoptimized it makes the
# real-data integration tests ~5x slower. Optimize just it in dev builds.
[profile.dev.package.squirrel-sys]
opt-level = 3

# The test suite's profile (`scripts/test_all.py`): release's optimisation, but
# incremental, so a rebuild after a small edit recompiles only what changed.
[profile.test-release]
inherits = "release"
incremental = true
