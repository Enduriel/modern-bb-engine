[package]
name = "bb-render"
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
bb-assets = { path = "../bb-assets" }
squirrel-bb = { path = "../squirrel-bb" }
wgpu = "30.0.1"
png = "0.18.1"
cosmic-text = "0.19.0"
unicode-script = "0.5.8"

# macOS: the UI page's paints (IOSurfaces) as Metal textures (ui_page/macos.rs), through
# `msg_send!` alone; wgpu-hal uses the same objc2.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"

# Windows: the UI page's paints (D3D11 shared textures) opened on wgpu's Direct3D 12
# device (ui_page/windows.rs). The version wgpu-hal uses, so its Direct3D 12 types are ours.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = [
	"Win32_Foundation",
	"Win32_Graphics_Direct3D12",
	"Win32_Graphics_Dxgi_Common",
	"Win32_System_Threading",
] }

[dev-dependencies]
bb-engine = { path = "../bb-engine" }
squirrel = { path = "../squirrel" }
