[package]
name = "bb-audio"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

# The game's sound through kira: sounds read from
# the game's files on first use, played on the device, or for tests on kira's mock
# backend. Only the codecs the game ships: PCM wav (sounds) and Ogg Vorbis (music).
[dependencies]
bb-assets = { path = "../bb-assets" }
kira = { version = "0.12.5", default-features = false, features = ["cpal", "wav", "pcm", "ogg", "vorbis"] }
# The decoder kira already uses (no crate of its own added: the version kira pulls in),
# named for its `MediaSource` trait, so a long sound streams from its archive in place.
symphonia = { version = "0.6.1", default-features = false }
squirrel-bb = { path = "../squirrel-bb" }

[dev-dependencies]
bb-engine = { path = "../bb-engine" }
squirrel = { path = "../squirrel" }
